services:

  # ── Wi-Vi Sentinel ──────────────────────────────────────────────────────────
  sentinel:
    build: .
    container_name: wivi-sentinel
    restart: unless-stopped
    ports:
      - "${FLASK_PORT:-5555}:5555"
    env_file: .env
    volumes:
      - ./data:/app/data          # persist profiles.json across restarts
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0 # ESP32 USB serial passthrough
